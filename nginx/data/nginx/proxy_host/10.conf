# ------------------------------------------------------------
# backend.dev.jedieduca.com.br
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "127.0.0.1";
  set $port           80;

  listen 80;
listen [::]:80;


  server_name backend.dev.jedieduca.com.br;
http2 off;






  # Block Exploits
  include conf.d/include/block-exploits.conf;







  access_log /data/logs/proxy-host-10_access.log proxy;
  error_log /data/logs/proxy-host-10_error.log warn;

root /var/www/html/site/public;
index index.php index.html;

# 1. Trata requisições gerais de rotas do Laravel
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 2. Regra prioritária (^~) para servir arquivos do /storage diretamente do disco físico
location ^~ /storage/ {
    alias /var/www/html/site/storage/app/public/;
    try_files $uri $uri/ =404;
    expires max;
    log_not_found off;
    access_log off;
}

# 3. Garante o carregamento de CSS, JS, Fontes e imagens estáticas (Vite/Build)
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    root /var/www/html/site/public;
    expires max;
    log_not_found off;
    access_log off;
    try_files $uri =404;
}

# 4. Processamento PHP FastCGI
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass jedi_site_backend:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME /var/www/html/site/public$fastcgi_script_name;
    include fastcgi_params;
}

# 5. Protege arquivos ocultos (.env, .git)
location ~ /\.(?!well-known).* {
    deny all;
}





  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

