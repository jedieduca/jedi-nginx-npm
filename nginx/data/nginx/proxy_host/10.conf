# ------------------------------------------------------------
# backend.dev.jedieduca.com.br
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "jedi_site_backend";
  set $port           9000;

  listen 80;
listen [::]:80;


  server_name backend.dev.jedieduca.com.br;
http2 off;











proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-10_access.log proxy;
  error_log /data/logs/proxy-host-10_error.log warn;

root /var/www/html/site/public;
index index.php index.html;

disable_symlinks off;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# O prefixo ^~ força o Nginx a servir o arquivo físico e ignora qualquer repasse
location ^~ /storage/ {
    alias /var/www/html/site/storage/app/public/;
    try_files $uri $uri/ =404;
    access_log off;
    log_not_found off;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass jedi_site_backend:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME /var/www/html/site/public$fastcgi_script_name;
    include fastcgi_params;
}





  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

