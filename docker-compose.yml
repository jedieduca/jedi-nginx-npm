services:
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: jedi_nginx_proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ${CAMINHO_PROJETO_ADIANTI}:/var/www/html
      - ${CAMINHO_PROJETO_SITE}:/var/www/html/site
      - ${CAMINHO_PROJETO_SITE_STORAGE}:/var/www/html/site/storage/app/public
      - graficos_data:/var/www/html/mad/app/output/charts:ro
    networks:
      - jedieduca-network

volumes:
  graficos_data:
    name: jedi-python_graficos_data
    external: true

networks:
  jedieduca-network:
    external: true