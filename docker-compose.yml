# version: '3.8'

services:
  # Container 01 - NGINX com Interface Gráfica (Nginx Proxy Manager)
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: jedi_nginx_proxy
    restart: unless-stopped
    ports:
      - '80:80'   # Tráfego HTTP público
      - '443:443' # Tráfego HTTPS público
      - '81:81'   # Porta de Administração do Painel Web (recomenda-se proteger depois)
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ${CAMINHO_PROJETO_ADIANTI}:/var/www/html
      - graficos_data:/var/www/html/mad/app/output/charts:ro
      - ./backend/site:/var/www/html/site
      - /var/www/html/site/vendor        # Preserva a pasta vendor gerada dentro da imagem
      - /var/www/html/site/public/build  # Preserva os assets do Vite compilados na imagem
      - /var/www/html/site/storage/app/public # Preserva as imagens do storage geradas na imagem
    networks:
      jedieduca-network:
        aliases:
          - api.dev.jedieduca.com.br

volumes:
  graficos_data:
    name: jedi-python_graficos_data
    external: true

networks:
  jedieduca-network:
    external: true